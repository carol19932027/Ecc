<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aether ECC — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.25), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.28), transparent 48%),
        #060913;
    }
    .glass {
      max-width: 400px;
      width: 100%;
      padding: 28px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 20px; color: rgba(226, 232, 240, 0.8); line-height: 1.55; }
    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(129, 140, 248, 0.28));
      color: #fff;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="glass">
    <h1>Offline Mode</h1>
    <p>Aether ECC is cached locally, but the live server connection is temporarily unavailable.</p>
    <button type="button" onclick="location.reload()">Reconnect</button>
  </main>
</body>
</html>
