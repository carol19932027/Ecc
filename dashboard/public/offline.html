<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aether ECC — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      color: #FFFFFF;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 145, 255, 0.22), transparent 46%),
        radial-gradient(circle at 80% 80%, rgba(109, 124, 255, 0.20), transparent 48%),
        #000000;
    }
    .glass {
      max-width: 340px;
      width: 100%;
      padding: 22px 18px 18px;
      border-radius: 34px;
      background: rgba(28, 28, 30, 0.78);
      border: 0.5px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(30px) saturate(120%);
      -webkit-backdrop-filter: blur(30px) saturate(120%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 18px 48px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 1.294; }
    p { margin: 0 0 18px; color: rgba(235, 235, 245, 0.60); font-size: 15px; line-height: 1.333; }
    button {
      appearance: none;
      width: 100%;
      min-height: 48px;
      border: 0;
      background: #0091FF;
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <main class="glass">
    <h1>Offline Mode</h1>
    <p>Aether ECC is cached locally, but the live server connection is temporarily unavailable.</p>
    <button type="button" onclick="location.reload()">Reconnect</button>
  </main>
</body>
</html>
